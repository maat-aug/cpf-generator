name: Publicar no Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Dois pushes seguidos não podem disputar o mesmo slot: o deploy antigo é cancelado.
concurrency:
  group: azure-static-web-apps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Usar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir tipos
        run: npm run typecheck

      - name: Gerar site estático
        run: npm run build

      - name: Conferir configuração do Azure
        run: test -f out/staticwebapp.config.json

      - name: Publicar
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_DUNE_038005E10 }}
          action: upload
          app_location: out
          api_location: ""
          output_location: ""
          skip_app_build: true
